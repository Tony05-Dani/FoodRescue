
<div class="panel">

  <div class="header">
    <div>
      <h1>Nuevo alimento</h1>
      <p>Registra un alimento y su primer lote en Food Rescue.</p>
    </div>

    <button type="button" class="btn-secondary" (click)="cancelar()">
      Volver
    </button>
  </div>

  <div class="form-card">

    <form (ngSubmit)="guardar()" #formAlimento="ngForm">

      <h2>Datos del alimento</h2>

      <div class="form-group">
        <label>Producto</label>
        <input
          type="text"
          name="producto"
          [(ngModel)]="alimento.producto"
          placeholder="Ej. Arroz"
          required>
      </div>

      <div class="form-group">
        <label>Cantidad total</label>
        <input
          type="number"
          name="cantidad"
          [(ngModel)]="alimento.cantidad"
          min="1"
          required>
      </div>

      <div class="form-group">
        <label>Unidad de medida</label>
        <select
          name="unidadMedida"
          [(ngModel)]="alimento.unidadMedida"
          required>
          <option value="Unidades">Unidades</option>
          <option value="Kilogramos">Kilogramos (kg)</option>
          <option value="Libras">Libras (lb)</option>
          <option value="Gramos">Gramos (g)</option>
          <option value="Litros">Litros (L)</option>
          <option value="Mililitros">Mililitros (ml)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Fecha de vencimiento general</label>
        <input
          type="date"
          name="fechaVencimiento"
          [(ngModel)]="alimento.fechaVencimiento"
          required>
      </div>

      <div class="form-group">
        <label>Tipo de alimento</label>
        <select
          name="tipoAlimento"
          [(ngModel)]="alimento.tipoAlimento"
          required>
          <option value="">Selecciona un tipo</option>
          <option value="Granos">Granos</option>
          <option value="Lácteos">Lácteos</option>
          <option value="Carnes">Carnes</option>
          <option value="Frutas">Frutas</option>
          <option value="Verduras">Verduras</option>
          <option value="Bebidas">Bebidas</option>
          <option value="Otros">Otros</option>
        </select>
      </div>

      <div class="form-group">
        <label>Responsable</label>
        <input
          type="text"
          name="responsable"
          [(ngModel)]="alimento.responsable"
          placeholder="Nombre del responsable"
          required>
      </div>

      <hr>

      <h2>Datos del primer lote</h2>
      <p>Información del lote inicial asociado al alimento.</p>

      <div class="form-group">
        <label>Código del lote</label>
        <input
          type="text"
          name="codigoLote"
          [(ngModel)]="lote.codigoLote"
          placeholder="Ej. LOTE-001"
          required>
      </div>

      <div class="form-group">
        <label>Cantidad del lote</label>
        <input
          type="number"
          name="cantidadLote"
          [(ngModel)]="lote.cantidad"
          min="1"
          required>
      </div>

      <div class="form-group">
        <label>Fecha de vencimiento del lote</label>
        <input
          type="date"
          name="fechaVencimientoLote"
          [(ngModel)]="lote.fechaVencimiento"
          required>
      </div>

      <div class="form-group">
        <label>Precio unitario ($)</label>
        <input
          type="number"
          name="precioUnitario"
          [(ngModel)]="lote.precioUnitario"
          min="0"
          step="0.01"
          required>
      </div>

      <div class="actions">

        <button
          type="button"
          class="btn-secondary"
          (click)="cancelar()">
          Cancelar
        </button>

        <button
          type="submit"
          class="btn-primary"
          [disabled]="guardando || formAlimento.invalid">
          {{ guardando ? 'Guardando...' : 'Registrar alimento y lote' }}
        </button>

      </div>

    </form>

  </div>

</div>
