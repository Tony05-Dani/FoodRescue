
<div class="panel">

  <div class="header">

    <div>
      <h1>Nuevo alimento</h1>
      <p>Registra un nuevo alimento en Food Rescue.</p>
    </div>

    <button class="btn-secondary" (click)="cancelar()">
      Volver
    </button>

  </div>

  <div class="form-card">

    <form (ngSubmit)="guardar()">

      <div class="form-group">
        <label>Producto</label>
        <input
          type="text"
          name="producto"
          [(ngModel)]="alimento.producto"
          placeholder="Ej. Arroz"
          required>
      </div>

      <div class="form-group">
        <label>Cantidad</label>
        <input
          type="number"
          name="cantidad"
          [(ngModel)]="alimento.cantidad"
          min="1"
          required>
      </div>

      
       <div class="form-group">
        <label>Unidad de medida</label>
        <select
         name="unidadMedida"
         [(ngModel)]="alimento.unidadMedida"
        required>

       <option value="Unidades">Unidades</option>
       <option value="Kilogramos">Kilogramos (kg)</option>
       <option value="Gramos">Gramos (g)</option>
       <option value="Litros">Litros (L)</option>
       <option value="Mililitros">Mililitros (ml)</option>

      </select>
      </div>



      <div class="form-group">
        <label>Fecha de vencimiento</label>
        <input
          type="date"
          name="fechaVencimiento"
          [(ngModel)]="alimento.fechaVencimiento"
          required>
      </div>

      <div class="form-group">
        <label>Tipo de alimento</label>
        <select
          name="tipoAlimento"
          [(ngModel)]="alimento.tipoAlimento"
          required>

          <option value="">Selecciona un tipo</option>
          <option value="Granos">Granos</option>
          <option value="Lácteos">Lácteos</option>
          <option value="Carnes">Carnes</option>
          <option value="Frutas">Frutas</option>
          <option value="Verduras">Verduras</option>
          <option value="Bebidas">Bebidas</option>
          <option value="Otros">Otros</option>

        </select>
      </div>

      <div class="form-group">
        <label>Estado</label>
        <select
          name="estado"
          [(ngModel)]="alimento.estado">

          <option value="Disponible">Disponible</option>
          <option value="Consumo prioritario">Consumo prioritario</option>
          <option value="No disponible">No disponible</option>

        </select>
      </div>

      <div class="form-group">
        <label>Responsable</label>
        <input
          type="text"
          name="responsable"
          [(ngModel)]="alimento.responsable"
          placeholder="Nombre del responsable"
          required>
      </div>

      <div class="actions">

        <button
          type="button"
          class="btn-secondary"
          (click)="cancelar()">
          Cancelar
        </button>

        <button
          type="submit"
          class="btn-primary"
          [disabled]="guardando">

          {{ guardando ? 'Guardando...' : 'Registrar alimento' }}

        </button>

      </div>

    </form>

  </div>

</div>
